services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ezmed-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ezmed-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ezmed}
      POSTGRES_USER: ${POSTGRES_USER:-ezmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezmed}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: ezmed-app
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      POSTGRES_HOST: postgres
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres
    ports:
      - "8000:8000"
    command: ["uvicorn", "ezmed.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  qdrant_data:
  postgres_data:
