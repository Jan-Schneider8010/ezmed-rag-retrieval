[project]
name = "ezmed-rag-retrieval"
version = "0.1.0"
description = "RAG prototype for medical lay queries: LLM chunk enrichment + query rewriting ablation study."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jan Schneider", email = "jan@activesearch.ai" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "openai>=1.40",
    "qdrant-client>=1.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "biopython>=1.84",
    "lxml>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "langfuse>=2.40",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "nbstripout>=0.9",
]

[project.scripts]
ezmed = "ezmed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
